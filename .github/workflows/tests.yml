name: Tests

# The merge gate. Plain pytest, independent of the Claude review job: a
# failing test fails this check. Needs no secrets, so it also runs on PRs
# from forks. Make `fast` (and `slow`) required checks in branch protection.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # Also the T5 check: torch, torchaudio and demucs are NOT installed, so
    # any fast test that imports them eagerly fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (no neural stack)
        run: >-
          uv sync --locked
          --no-install-package torch
          --no-install-package torchaudio
          --no-install-package demucs
      - name: Fast suite
        run: uv run --no-sync pytest -m "not slow" -ra

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache Demucs model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs
      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small
      - name: Install dependencies
        run: uv sync --locked
      - name: Fetch model weights
        run: uv run --no-sync mrw models fetch
      - name: Slow suite (Demucs + Whisper)
        run: uv run --no-sync pytest -m slow -ra
